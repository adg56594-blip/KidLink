      <div><strong>KidLink</strong><span>Église du Christianisme Céleste</span></div>

    <div class="foot-contacts">
      <a class="foot-link" href="tel:+{{ admin_phone_tel }}"><svg class="ic"><use href="#i-phone"/></svg> Administration : {{ admin_phone_pretty }}</a>
      <a class="foot-link" href="https://wa.me/{{ admin_wa }}" rel="noopener noreferrer" target="_blank"><svg class="ic"><use href="#i-wa"/></svg> WhatsApp administration</a>
