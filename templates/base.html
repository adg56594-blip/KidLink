{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a46a8">
<meta name="description" content="Sèmè Kids — le bracelet qui ramène l'enfant à sa famille. Église du Christianisme Céleste.">
<title>{% block title %}Sèmè Kids{% endblock %} · Sèmè Kids</title>
<link rel="preload" href="{% static 'fonts/jakarta.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'fonts/nunito.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="{% static 'img/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">
<script src="{% static 'js/app.js' %}" defer></script>
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% include "partials/icons.html" %}
<a class="skip" href="#main">Aller au contenu</a>
{% block body %}{% endblock %}
</body>
</html>
