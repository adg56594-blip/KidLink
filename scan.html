<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eaf5ff">
<title>Fiche du pèlerin</title>
<style>
:root{color-scheme:light;--ink:#123b78;--muted:#52677f;--line:#d5e8f8;--green:#078b49}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#dff0ff,#f8fbff 65%,#eaf5ff);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:auto;padding:18px 16px 34px}
header{text-align:center;padding:4px 4px 20px}
.emblem{width:min(190px,52vw);height:auto;display:block;margin:0 auto 8px}
.church{font-size:clamp(1.05rem,4.6vw,1.45rem);font-weight:900;line-height:1.16;margin:8px 0;color:var(--ink)}
.motto{margin:8px 0 0;color:#174d91;font-family:Georgia,serif;font-style:italic;font-size:1rem}
.card{background:#fff;border:1px solid #b9dcff;border-radius:24px;padding:22px 20px;box-shadow:0 8px 24px #164b7918}
.kicker{margin:0 0 5px;color:var(--muted);font-size:1rem}
h1{font-size:clamp(1.8rem,7vw,2.25rem);line-height:1.12;margin:0 0 14px;overflow-wrap:anywhere;color:var(--ink)}
dl{margin:6px 0 0}
.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
dt{color:var(--muted);font-size:.9rem;margin:0 0 2px}
dd{margin:0;font-size:1.08rem;font-weight:700;overflow-wrap:anywhere;color:#173f78}
.actions{display:grid;gap:10px;margin-top:22px}
.call{display:block;text-align:center;text-decoration:none;background:var(--green);color:#fff;font-weight:800;font-size:1.08rem;border-radius:15px;padding:14px 12px}
.call small{display:block;font-weight:500;font-size:.98rem}
.call.secondary{background:#fff;color:var(--green);border:2px solid var(--green)}
.printbtn{font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:#eef6ff;border:2px solid #b9dcff;border-radius:15px;padding:12px;cursor:pointer;width:100%}
.demo{margin:16px 0 0;text-align:center;color:var(--muted);font-size:.98rem}
.err{background:#fff;border:1px solid #e6aaaa;color:#9b1c1c;padding:16px;border-radius:14px;font-weight:600;margin:0}
footer{text-align:center;color:#174d91;padding:22px 8px 4px;font-family:Georgia,serif;font-style:italic;font-size:1.1rem}
@page{margin:12mm}
@media print{
  body{background:#fff;min-height:0}
  .card{box-shadow:none}
  .actions,.demo{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
<header>
<svg class="emblem" viewBox="0 0 300 205" role="img" aria-label="Emblème de l'Église du Christianisme Céleste">
 <path d="M18 175 A132 132 0 0 1 282 175" fill="none" stroke="#e62929" stroke-width="13"/>
 <path d="M31 175 A119 119 0 0 1 269 175" fill="none" stroke="#ff9f18" stroke-width="12"/>
 <path d="M44 175 A106 106 0 0 1 256 175" fill="none" stroke="#f4df24" stroke-width="12"/>
 <path d="M57 175 A93 93 0 0 1 243 175" fill="none" stroke="#19a653" stroke-width="12"/>
 <path d="M70 175 A80 80 0 0 1 230 175" fill="none" stroke="#1684dc" stroke-width="12"/>
 <path d="M83 175 A67 67 0 0 1 217 175" fill="none" stroke="#6846b8" stroke-width="12"/>
 <path d="M20 177 Q70 150 105 178 T190 178 T280 177 L280 202 L20 202Z" fill="#d9efff"/>
 <path d="M122 33 L132 15 L143 30 L150 5 L158 30 L171 15 L179 36 L169 49 L132 49Z" fill="#e8b52e" stroke="#a87912" stroke-width="3"/>
 <path d="M130 48 Q150 57 171 48" fill="none" stroke="#a87912" stroke-width="5"/>
 <path d="M117 116 Q150 82 183 116 Q150 150 117 116Z" fill="#fff4d5" stroke="#b78330" stroke-width="3"/>
 <ellipse cx="150" cy="116" rx="12" ry="15" fill="#1786a9"/><circle cx="150" cy="116" r="6" fill="#102d4c"/>
 <path d="M150 145 V192 M133 161 H167" stroke="#d6a52d" stroke-width="10" stroke-linecap="round"/>
</svg>
<div class="church">ÉGLISE DU CHRISTIANISME CÉLESTE</div>
<p class="motto">Foi • Amour • Espérance</p>
</header>

<section class="card" id="card" aria-live="polite"></section>
<footer>Église du Christianisme Céleste</footer>
</main>

<script>
(function () {
  'use strict';
  var card = document.getElementById('card');

  // Lecture des données : #n=...&p=... (QR de l'outil) ou ?n=...&p=...
  function readParams() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (!raw) raw = (location.search || '').replace(/^\?/, '');
    try { return new URLSearchParams(raw); } catch (e) { return new URLSearchParams(''); }
  }
  var p = readParams();
  function get(k) { return (p.get(k) || '').replace(/\s+/g, ' ').trim(); }

  var data = {
    nom: get('n'), prenom: get('p'),
    parents: get('pa'), telParents: get('t'),
    charge: get('c'), telCharge: get('tc'),
    eglise: get('e')
  };

  // Aucune donnée dans l'adresse : on affiche l'exemple (comme sur la capture)
  var demo = !data.nom && !data.prenom;
  if (demo) {
    data = {
      nom: 'Exemple', prenom: 'Jean',
      parents: 'Parents Exemple', telParents: '+229 00 00 00 00 00',
      charge: 'Responsable Exemple', telCharge: '+229 00 00 00 00 00',
      eglise: 'Paroisse Exemple'
    };
  }

  function el(tag, cls, text, parent) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    (parent || card).appendChild(n);
    return n;
  }

  var fullName = (data.prenom + ' ' + data.nom).trim();
  document.title = 'Fiche du pèlerin – ' + fullName;

  el('p', 'kicker', 'Fiche du pèlerin');
  el('h1', '', fullName);

  var dl = el('dl');
  var rows = [
    ['Nom', data.nom.toUpperCase()],
    ['Prénom', data.prenom],
    ['Nom des parents', data.parents],
    ['Numéro des parents', data.telParents],
    ['Chargé responsable', data.charge],
    ['Numéro du chargé', data.telCharge],
    ['Église', data.eglise]
  ];
  rows.forEach(function (r) {
    if (!r[1]) return;
    var w = el('div', 'field', undefined, dl);
    el('dt', '', r[0], w);
    el('dd', '', r[1], w);
  });

  var actions = el('div', 'actions');
  function addCall(label, number, secondary) {
    var clean = (number || '').replace(/[^\d+]/g, '');
    if (!clean) return;
    var a = el('a', 'call' + (secondary ? ' secondary' : ''), undefined, actions);
    a.href = 'tel:' + clean;
    a.appendChild(document.createTextNode(label));
    el('small', '', number, a);
  }
  addCall('Appeler les parents', data.telParents, false);
  addCall('Appeler le chargé', data.telCharge, true);

  var pb = el('button', 'printbtn', 'Imprimer la fiche', actions);
  pb.type = 'button';
  pb.addEventListener('click', function () { window.print(); });

  if (demo) {
    el('p', 'demo', "Exemple d'affichage — les informations sont fictives et seront remplacées par celles du pèlerin.");
  }
})();
</script>
</body>
</html>
